<style>
:root{color-scheme:light;--bg:#f4f6fa;--paper:#fff;--ink:#1f2737;--muted:#67758b;--line:#e1e6ef;--violet:#5561d6;--soft:#edf0ff;--green:#147d62;--red:#b44748;--shadow:0 7px 25px #222d4808}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.42;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a0a9ff;outline-offset:2px}a{color:var(--violet)}h1,h2,h3,h4{letter-spacing:-.4px;line-height:1.3;margin:0 0 10px}h1{font-size:30px}h2{font-size:21px}h3{font-size:17px}h4{font-size:14px}p{margin:0 0 11px}.muted{color:var(--muted)}.small{font-size:12px}.micro{font-size:11px}.shell{max-width:1460px;margin:auto;padding:26px 25px 65px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.back{font-size:12px;font-weight:650;text-decoration:none}.eyebrow{color:var(--violet);font-size:11px;letter-spacing:1.35px;font-weight:800;text-transform:uppercase}.topmeta{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;margin-top:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:23px}.sidebar{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:8px;background:var(--soft);color:#4654b9;border:1px solid #dce1ff;padding:4px 9px;font-size:11px;font-weight:700}.pill.green{color:var(--green);background:#eaf8f0;border-color:#d3ece0}.pill.warn{color:#94651e;background:#fff7e5;border-color:#f0e1bf}.progress{height:9px;border-radius:20px;background:#e7eaf3;overflow:hidden;margin:10px 0}.progress span{height:100%;display:block;background:var(--violet);transition:width .25s}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #d8deeb;border-radius:9px;background:#fff;padding:10px 14px;min-height:39px;font-size:13px;font-weight:700;text-decoration:none}.btn.primary{background:var(--violet);border-color:var(--violet);color:white}.btn:hover:not(:disabled){filter:brightness(.97)}.btn.ghost{border-color:transparent;background:transparent}.btn.sm{padding:7px 10px;min-height:31px;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:17px 0}.navbutton{display:block;width:100%;padding:10px 12px;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;margin:3px 0}.navbutton:hover{background:#f4f5fc}.navbutton.active{background:var(--soft);border-color:#d7dcfb;color:#404cac}.navbutton strong{display:block;font-size:12px}.navbutton span{font-size:11px;color:var(--muted)}.navtitle{margin:20px 0 7px;font-size:10px;text-transform:uppercase;font-weight:800;color:#8b93a4;letter-spacing:1px}.navpill{margin-left:auto;font-size:11px;color:#5162b6}.hero{border-radius:16px;background:linear-gradient(115deg,#ecefff,#f9faff 65%,#f3fbf6);border:1px solid #dfe3fa;padding:26px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hero p{max-width:670px;color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}.tile{padding:18px;border:1px solid var(--line);border-radius:13px;background:white}.tile h3{font-size:14px}.tile p{font-size:12px;color:var(--muted)}.tile button{width:100%;margin-top:12px}.moduleHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}.moduleHeader p{color:var(--muted);max-width:760px}.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.term{border:1px solid var(--line);background:#fafbfe;border-radius:12px;padding:15px}.term h4{color:#333e81;margin-bottom:7px}.term p{font-size:13px}.term .example{color:#45516b}.term .use{color:#52657d}.section{margin-top:25px;padding-top:23px;border-top:1px solid var(--line)}.steps{list-style:none;padding:0;margin:14px 0;display:grid;gap:10px}.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px;background:#f8f9fd;border:1px solid #e7eaf2;border-radius:11px}.number{width:25px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:white;background:var(--violet);flex:none;font-size:12px;font-weight:750}.examplebox{background:#f0f7fb;border:1px solid #dbe9f2;border-radius:12px;padding:16px;white-space:pre-wrap}.remember{border-left:3px solid var(--violet);padding:12px 16px;background:#f6f7ff;border-radius:0 10px 10px 0}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:15px}.tab{border:1px solid transparent;background:transparent;border-radius:8px;padding:9px 13px;font-weight:650;font-size:12px}.tab.active{background:var(--soft);color:#4350bc;border-color:#dbe0ff}.flowdiagram{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.flowdiagram span{padding:9px 12px;border-radius:9px;background:#f0f3fa;border:1px solid #dce2f0;font-size:12px;font-weight:600}.flowdiagram b{align-self:center;color:var(--violet)}.input{width:100%;border:1px solid #d7deeb;background:white;padding:11px 12px;border-radius:9px}.option{border:1px solid #d9dfea;background:white;border-radius:10px;width:100%;text-align:left;display:flex;gap:12px;padding:14px;margin:9px 0}.option:hover:not(:disabled){background:#f8f9ff}.option.selected{border-color:var(--violet);background:#eef0ff}.option.correct{border-color:#83c9a9;background:#ebf8f2}.option.incorrect{border-color:#e4adaf;background:#fff1f1}.letter{border:1px solid #d7deeb;border-radius:7px;padding:3px 8px;align-self:flex-start;flex:none;font-weight:750;font-size:12px}.feedback{padding:16px;border-radius:12px;background:#ecf8f2;border:1px solid #d5eadf;margin-top:15px}.feedback.wrong{background:#fff5ee;border-color:#f0dece}.feedback p{margin-top:8px}.question{font-size:18px;margin:17px 0}.qprogress{display:flex;gap:8px;align-items:center}.qprogress span{display:inline-block;height:7px;width:44px;border-radius:20px;background:#e0e4ee}.qprogress span.done{background:#28a27a}.qprogress span.current{background:var(--violet)}.note{background:#f8f9fc;border:1px solid var(--line);padding:15px;border-radius:12px}.note textarea{width:100%;padding:10px;border:1px solid #d5dce8;border-radius:10px;min-height:90px;resize:vertical}.glossaryItem{padding:14px;border:1px solid var(--line);border-radius:11px;margin:10px 0;background:#fbfcff}.glossaryItem b{color:#35418b}.glossaryItem p{font-size:13px;margin:7px 0}.callout{background:#fff8e8;border:1px solid #eadbbb;padding:12px 15px;border-radius:12px;font-size:12px;color:#66522e}.empty{text-align:center;color:var(--muted);padding:40px 15px}.architecture{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:15px}.archbox{border-radius:10px;background:#f0f3ff;border:1px solid #dbe1fa;padding:14px;text-align:center;font-size:12px}.archbox strong{display:block;color:#323e90}.error{color:var(--red)}@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.terms{grid-template-columns:1fr}.architecture{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:17px 12px 55px}}@media(max-width:520px){.hero{padding:18px}.card{padding:17px}.architecture{grid-template-columns:1fr}h1{font-size:25px}.tabs{gap:3px}.tab{padding:8px 9px}}
</style>

<body><div class="shell">
<header class="topbar"><div><a class="back" href="/">← Back to Learning Studio</a><div class="eyebrow" style="margin-top:12px">System design · Study & practice</div><h1>TableOS System Design</h1><div class="topmeta">As built v0.36.0 · Source dated 19 Nov 2026 · 16 sections</div></div><div class="row wrap"><span class="pill">Term → Definition → Example → Working</span><a class="btn sm" href="/tableos-architecture">▶ Architecture Animation Lab</a><a class="btn sm" href="/day3">← Day 3</a></div></header>
<div class="layout">
<aside id="sidebar" class="card sidebar"><div class="muted">Loading study modules…</div></aside>
<main id="main" class="card" aria-live="polite"><h2>Opening TableOS study hub…</h2></main>
</div></div>
<script>
"use strict";
const KEY="arslan-learning-studio-tableos-v1";
const esc=s=>String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
let data=null,view="overview",active=0,qi=0,selected=null,glossaryQuery="",showAllDefinitions=true;
const blank=()=>({answers:{},skippedTopics:[],skippedQuestions:[],notes:{},viewed:[],bookmarks:[],version:1});
let state;
try{state={...blank(),...(JSON.parse(localStorage.getItem(KEY))||{})};if(!state.answers||typeof state.answers!=="object")state.answers={};for(const k of ["skippedTopics","skippedQuestions","viewed","bookmarks"])if(!Array.isArray(state[k]))state[k]=[];if(!state.notes||typeof state.notes!=="object")state.notes={}}catch{state=blank()}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function qId(i,j){return "t"+i+"q"+j}
function numDone(){return Object.keys(state.answers).length}
function correctCount(){return Object.values(state.answers).filter(a=>a.correct).length}
function started(i){return state.viewed.includes(i)}
function nextUnanswered(i){const m=data.modules[i];return m.questions.findIndex((q,j)=>!state.answers[qId(i,j)]&&!state.skippedQuestions.includes(qId(i,j)))}
function progress(){return Math.round(numDone()/(data.modules.reduce((n,m)=>n+m.questions.length,0))*100)}
function moduleDone(i){return data.modules[i].questions.filter((q,j)=>!!state.answers[qId(i,j)]).length}
function renderSidebar(){const skip=new Set(state.skippedTopics);$("sidebar").innerHTML='<div class="row between"><b>TableOS learning path</b><span class="pill">'+progress()+'%</span></div><div class="progress"><span style="width:'+progress()+'%"></span></div><p class="small muted">'+numDone()+' / 48 questions completed · '+correctCount()+' correct</p><div class="actions"><button class="btn sm" data-action="overview">Dashboard</button><button class="btn sm" data-action="glossary">All definitions</button><button class="btn sm" data-action="review">Review</button></div><div class="navtitle">16 source-based modules</div>'+data.modules.map((m,i)=>'<button class="navbutton '+(active===i&&["learn","quiz"].includes(view)?"active":"")+'" data-action="module" data-index="'+i+'"><strong>'+esc(m.title)+(skip.has(i)?' <span class="pill warn">Skipped</span>':'')+'</strong><span>PDF p. '+m.page+' · '+m.terms.length+' terms · '+moduleDone(i)+'/3 questions</span></button>').join('')+'<div class="navtitle">Resources</div><p class="small muted">PDF: TableOS System Design — as built (v0.36.0). Examples are educational illustrations unless labeled as-built.</p><button class="btn sm" data-action="reset">Reset TableOS progress</button>'}
function renderTabs(){return '<nav class="tabs" aria-label="TableOS study views">'+[["overview","Overview"],["learn","Learn"],["quiz","Practice"],["glossary","Glossary"],["review","Review"]].map(([v,label])=>'<button class="tab '+(view===v?"active":"")+'" data-action="'+v+'">'+label+'</button>').join('')+'</nav>'}
function render(){if(!data)return;renderSidebar();$("main").innerHTML=renderTabs()+({overview:overviewPage,learn:learnPage,quiz:quizPage,glossary:glossaryPage,review:reviewPage}[view]||overviewPage)()}
function overviewPage(){const mcount=data.modules.length,termcount=data.modules.reduce((n,m)=>n+m.terms.length,0),qcount=data.modules.reduce((n,m)=>n+m.questions.length,0);
const diagrams='<div class="architecture"><div class="archbox"><strong>Browser</strong>React views + WebSocket</div><div class="archbox"><strong>API</strong>Auth + transactions</div><div class="archbox"><strong>PostgreSQL</strong>core / data / audit</div><div class="archbox"><strong>Redis + Workers</strong>Realtime + jobs</div></div>';
return '<div class="hero"><div><span class="eyebrow">From complicated PDF to clear concepts</span><h2>Understand the design, then explain it.</h2><p>Follow the same 16-section order as the original as-built document. Every section has concise definitions, actual system workings, a plain-language example, and three progressively harder interview questions.</p><div class="actions"><button class="btn primary" data-action="module" data-index="0">Start Section 1 →</button><a class="btn" href="/tableos-architecture">▶ Watch architecture flow</a><button class="btn" data-action="glossary">Browse all '+termcount+' definitions</button></div></div><span class="pill">'+mcount+' sections · '+qcount+' questions</span></div>'+diagrams+
'<div class="tile" style="margin-top:16px;border-color:#bbc7f0;background:#f1f4ff"><h3>New · Animated Architecture Learning Lab</h3><p>See exactly what happens when you edit a record, open a private attachment, or sync to HubSpot. Explore 21 animated steps, inspect components, take checkpoints and practice explaining the complete flow.</p><a class="btn primary" href="/tableos-architecture">Launch interactive animation →</a></div><div class="callout" style="margin-top:16px"><b>Source accuracy:</b> This learning portal follows TableOS System Design — as built, version 0.36.0 (19 November 2026). Source facts are dated; examples are for understanding and may not represent real records. The original target architecture is not the same as the deployed system.</div>'+
'<div class="section"><div class="row between wrap"><h2>Choose a section</h2><span class="muted small">All sections unlocked · skip freely</span></div><div class="tiles">'+data.modules.map((m,i)=>'<article class="tile"><span class="pill">Section '+(i+1)+'</span><h3 style="margin-top:10px">'+esc(m.title)+'</h3><p>'+esc(m.overview)+'</p><div class="small muted">PDF p. '+m.page+' · '+m.terms.length+' definitions · '+moduleDone(i)+'/3 questions</div><button class="btn primary" data-action="module" data-index="'+i+'">Study this section →</button></article>').join('')+'</div></div>'}
function learnPage(){const m=data.modules[active];const skipped=state.skippedTopics.includes(active);return '<div class="moduleHeader"><div><span class="pill">SECTION '+(active+1)+' / 16 · PDF p. '+m.page+'</span><h2 style="margin-top:13px">'+esc(m.title)+'</h2><p>'+esc(m.overview)+'</p></div><div class="actions"><button class="btn sm" data-action="skipTopic">'+(skipped?"Restore section":"Skip section")+'</button><button class="btn primary sm" data-action="quiz">Practice →</button></div></div>'+
'<div class="section" style="margin-top:12px;padding-top:15px"><div class="row between wrap"><div><h3>1 · Definitions, examples & backend use</h3><p class="small muted">Each concept has its own short definition—no dense paragraphs.</p></div><button class="btn sm" data-action="toggleDefs">'+(showAllDefinitions?"Collapse":"Expand")+' definitions</button></div><div class="terms">'+(showAllDefinitions?m.terms.map(t=>'<article class="term"><h4>'+esc(t.term)+':</h4><p>'+esc(t.definition)+'</p><p class="example"><b>Example:</b> '+esc(t.example)+'</p><p class="use"><b>Backend use:</b> '+esc(t.use)+'</p></article>').join(''):'<p class="muted">Definitions collapsed. Select Expand to read them.</p>')+'</div></div>'+
'<div class="section"><h3>2 · How it works, step by step</h3><p class="muted small">Follow this workflow out loud as if explaining it to your interviewer.</p><ol class="steps">'+m.flow.map((step,i)=>'<li><span class="number">'+(i+1)+'</span><span>'+esc(step)+'</span></li>').join('')+'</ol></div>'+
'<div class="section"><h3>3 · Worked example</h3><div class="examplebox">'+esc(m.example)+'</div></div>'+
'<div class="section"><h3>4 · Remember this</h3><p class="remember">'+esc(m.remember)+'</p></div>'+
'<div class="section"><h3>5 · Check your understanding</h3><p>Three short interview questions, one at a time, with immediate explanations. Start basic and build up to advanced.</p><div class="actions"><button class="btn primary" data-action="quiz">Start section quiz →</button><button class="btn" data-action="nextModule">Next section →</button></div></div>'+notesPanel()}
function quizPage(){const m=data.modules[active],q=m.questions[qi],id=qId(active,qi),past=state.answers[id],disabled=!!past,choice=disabled?past.choice:selected,skipped=state.skippedQuestions.includes(id);const isCorrect=disabled&&past.correct;
return '<div class="moduleHeader"><div><span class="pill">SECTION '+(active+1)+' · '+esc(q.level)+' interview</span><h2 style="margin-top:12px">'+esc(m.title)+'</h2><p>Choose one answer and submit it. The explanation appears immediately.</p></div><button class="btn sm" data-action="learn">← Review definitions</button></div>'+
'<div class="section" style="margin-top:5px;padding-top:15px"><div class="row between wrap"><b>Question '+(qi+1)+' of '+m.questions.length+'</b><span class="pill '+(skipped?"warn":"")+'">'+(skipped?"Skipped earlier":"Progressive difficulty")+'</span></div><div class="qprogress" style="margin-top:14px">'+m.questions.map((x,j)=>'<span class="'+(state.answers[qId(active,j)]?"done":j===qi?"current":"")+'"></span>').join('')+'</div><h3 class="question">'+esc(q.prompt)+'</h3>'+q.options.map((o,j)=>'<button class="option '+(choice===j?"selected ":"")+(disabled&&j===q.answer?"correct":disabled&&j===choice?"incorrect":"")+'" data-action="choose" data-index="'+j+'" '+(disabled?"disabled":"")+' aria-pressed="'+(choice===j)+'"><span class="letter">'+("ABCD"[j])+'</span><span>'+esc(o)+'</span></button>').join('')+
(disabled?'<div class="feedback '+(isCorrect?"":"wrong")+'" role="status"><b>'+(isCorrect?"Correct!":"Not quite. Correct answer: "+("ABCD"[q.answer])+".")+'</b><p>'+esc(q.why)+'</p><p class="small muted">Correct choice: '+esc(q.options[q.answer])+'</p></div>':'')+
'<div class="actions"><button class="btn primary" data-action="check" '+(disabled||choice===null?"disabled":"")+'>Check answer</button><button class="btn" data-action="nextQuestion">Next question / section →</button><button class="btn" data-action="skipQuestion" '+(disabled?"disabled":"")+'>Skip question</button><button class="btn" data-action="retry" '+(!disabled?"disabled":"")+'>Try again</button></div><p class="small muted">If you miss one, review the definitions and working example, then try again. Skips are not graded as incorrect. Keyboard shortcut: 1–4 selects an answer.</p></div>'+
'<div class="section"><h3>Need help with a term?</h3><p class="muted small">Search the prepared definitions instantly; for a custom explanation, copy context into ChatGPT.</p>'+helpPanel()+'</div>'+notesPanel()}
function glossaryItems(search){const s=search.trim().toLowerCase();const found=[];data.modules.forEach((m,i)=>m.terms.forEach(t=>{if(!s||(t.term+" "+t.definition+" "+t.example+" "+t.use+" "+m.title).toLowerCase().includes(s))found.push({t,i})}));return found}
function glossaryList(){const matches=glossaryItems(glossaryQuery);return '<p class="small muted">'+matches.length+' matching definitions</p>'+matches.slice(0,80).map(({t,i})=>'<div class="glossaryItem"><div class="row between wrap"><b>'+esc(t.term)+':</b><button class="btn sm" data-action="module" data-index="'+i+'">Section '+(i+1)+' →</button></div><p>'+esc(t.definition)+'</p><p class="small"><b>Example:</b> '+esc(t.example)+' <b>Backend use:</b> '+esc(t.use)+'</p></div>').join('')+(matches.length>80?'<p class="small muted">Showing the first 80. Refine your search to see the rest.</p>':'')}
function glossaryPage(){return '<div class="row between wrap"><div><h2>All TableOS definitions</h2><p class="muted">Search every term, its definition, its example, or its backend use.</p></div><span class="pill">'+data.modules.reduce((n,m)=>n+m.terms.length,0)+' concepts</span></div><input id="glossarySearch" class="input" type="search" placeholder="Search: JSONB, outbox, roles, HubSpot, fields..." value="'+esc(glossaryQuery)+'" aria-label="Search all TableOS definitions"><div id="glossaryResults">'+glossaryList()+'</div>'}
function reviewPage(){const wrong=[];const skipped=[];data.modules.forEach((m,i)=>m.questions.forEach((q,j)=>{const id=qId(i,j),a=state.answers[id];if(a&&!a.correct)wrong.push({i,j,q,a});if(state.skippedQuestions.includes(id)&&!a)skipped.push({i,j,q})}));return '<h2>Your review queue</h2><p class="muted">Return to missed or skipped questions at any time.</p><div class="row wrap"><span class="pill warn">'+wrong.length+' missed</span><span class="pill">'+skipped.length+' skipped questions</span><span class="pill green">'+correctCount()+' correct</span></div><div class="section"><h3>Review mistakes</h3>'+(wrong.length?wrong.map(x=>'<div class="glossaryItem"><b>'+esc(x.q.prompt)+'</b><p class="small muted">Section '+(x.i+1)+' · '+esc(x.q.level)+'</p><p class="small">'+esc(x.q.why)+'</p><button class="btn sm" data-action="reviewQuestion" data-index="'+x.i+'" data-question="'+x.j+'">Open question</button></div>').join(''):'<div class="empty">No mistakes yet. Keep practicing.</div>')+'</div><div class="section"><h3>Skipped questions</h3>'+(skipped.length?skipped.map(x=>'<div class="glossaryItem"><b>'+esc(x.q.prompt)+'</b><p class="small muted">Section '+(x.i+1)+'</p><button class="btn sm" data-action="reviewQuestion" data-index="'+x.i+'" data-question="'+x.j+'">Attempt question</button></div>').join(''):'<div class="empty">No skipped questions.</div>')+'</div>'}
function notesPanel(){return '<div class="section"><h3>My notes and clarification questions</h3><p class="small muted">Saved locally for this section. For a conversational answer, copy the question and source context into ChatGPT.</p><textarea class="input" id="moduleNotes" placeholder="What do I still need to understand? Write your explanation in your own words.">'+esc(state.notes[active]||"")+'</textarea><div class="actions"><button class="btn sm" data-action="saveNotes">Save notes</button><button class="btn sm" data-action="copyQuestion">Copy question to ask ChatGPT</button></div><div id="noteStatus" class="small muted"></div></div>'}
function helpPanel(){return '<input id="termHelp" class="input" placeholder="e.g. JSONB, transaction, HubSpot mapping" aria-label="Find a definition"><div class="actions"><button class="btn sm" data-action="lookup">Explain term</button></div><div id="termResult" class="note small">Use the search to get an immediate source-based definition and example.</div>'}
function navigate(v){view=v;if(v==="quiz")openQuiz();else{render();window.scrollTo(0,0)}}
function openModule(i){if(i<0||i>=data.modules.length)return;active=i;view="learn";selected=null;if(!state.viewed.includes(i))state.viewed.push(i);save();render();window.scrollTo(0,0)}
function openQuiz(i=active,j=null){active=i;if(j===null){const n=nextUnanswered(active);qi=n<0?0:n}else qi=Math.max(0,Math.min(data.modules[active].questions.length-1,j));selected=null;view="quiz";save();render();window.scrollTo(0,0)}
function advance(){if(qi<data.modules[active].questions.length-1)openQuiz(active,qi+1);else if(active<data.modules.length-1)openModule(active+1);else navigate("review")}
document.addEventListener("click",async ev=>{const btn=ev.target.closest("[data-action]");if(!btn||!data)return;const a=btn.dataset.action,i=Number(btn.dataset.index);if(a==="module")openModule(i);else if(a==="overview"||a==="learn"||a==="glossary"||a==="review")navigate(a);else if(a==="quiz")openQuiz();else if(a==="nextModule")active<data.modules.length-1?openModule(active+1):navigate("review");else if(a==="toggleDefs"){showAllDefinitions=!showAllDefinitions;render()}else if(a==="skipTopic"){state.skippedTopics=state.skippedTopics.includes(active)?state.skippedTopics.filter(x=>x!==active):[...state.skippedTopics,active];save();render()}else if(a==="choose"){if(!state.answers[qId(active,qi)]){selected=i;render()}}else if(a==="check"){if(selected===null||state.answers[qId(active,qi)])return;const q=data.modules[active].questions[qi];state.answers[qId(active,qi)]={choice:selected,correct:selected===q.answer,at:new Date().toISOString()};state.skippedQuestions=state.skippedQuestions.filter(x=>x!==qId(active,qi));save();render()}else if(a==="nextQuestion")advance();else if(a==="skipQuestion"){if(!state.skippedQuestions.includes(qId(active,qi)))state.skippedQuestions.push(qId(active,qi));save();advance()}else if(a==="retry"){delete state.answers[qId(active,qi)];selected=null;save();render()}else if(a==="reviewQuestion")openQuiz(i,Number(btn.dataset.question));else if(a==="saveNotes"){state.notes[active]=$("moduleNotes")?.value||"";save();$("noteStatus").textContent="Saved in this browser."}else if(a==="copyQuestion"){const note=$("moduleNotes")?.value||"";const m=data.modules[active];const prompt="Help me prepare for a backend interview using the TableOS System Design — as built v0.36.0 (19 Nov 2026), section '"+m.title+"' (PDF p. "+m.page+"). My question: "+note+". Define each important term in 'Term: Definition' format, then explain the actual documented working step by step, use a clearly labeled practical example, and ask me one check question. Do not invent source details.";try{await navigator.clipboard.writeText(prompt);$("noteStatus").textContent="Copied! Paste into your ChatGPT conversation."}catch{$("noteStatus").textContent="Clipboard blocked; please select and copy your note manually."}}else if(a==="lookup"){const needle=$("termHelp")?.value.trim().toLowerCase();const match=glossaryItems(needle).find(x=>x.t.term.toLowerCase().includes(needle)&&needle);$("termResult").textContent=match?match.t.term+": "+match.t.definition+"\nExample: "+match.t.example+"\nBackend use: "+match.t.use:"No matching prepared definition. Try a shorter term or ask in ChatGPT."}else if(a==="reset"){if(confirm("Reset only TableOS study answers, skips, notes and progress? Original Learning Studio and Day 1–3 progress will remain unchanged.")){state=blank();active=0;qi=0;selected=null;save();navigate("overview")}}});
document.addEventListener("input",e=>{if(e.target.id==="glossarySearch"){glossaryQuery=e.target.value;$("glossaryResults").innerHTML=glossaryList()}});
document.addEventListener("keydown",e=>{if(view!=="quiz"||!data||state.answers[qId(active,qi)]||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||""))return;if(/^[1-4]$/.test(e.key)){const index=Number(e.key)-1;if(index<data.modules[active].questions[qi].options.length){selected=index;render()}}});
(async function init(){try{const res=await fetch("/tableos-study.json",{cache:"no-store"});if(!res.ok)throw Error("The study data could not be loaded ("+res.status+").");data=await res.json();if(!Array.isArray(data.modules)||data.modules.length!==16)throw Error("Unexpected TableOS study data.");render()}catch(err){$("main").innerHTML='<div class="empty"><h2>TableOS content unavailable</h2><p>'+esc(err.message)+'</p><p>Try refreshing the page after the latest deployment.</p></div>';}})();
</script>
</body></html>
