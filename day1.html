y","Validate inputs, outputs and policy boundaries","Increase randomness","Skip tests"],1,"Guardrails complement conventional security controls.","Basic"],["How should an LLM API manage provider outages?",["Infinite retries","Timeouts, bounded retries, circuit breakers and fallback","Ignore errors","Store secrets in prompts"],1,"Failure containment protects users and infrastructure.","Medium"],["A prompt change improves fluency but worsens factuality. What should gate release?",["Developer intuition","Versioned evaluation dataset and acceptance thresholds","Only response speed","Only token count"],1,"Quality gates should test grounded correctness, not just style.","Advanced"]]}];

if(!Array.isArray(state.answers))state.answers=MODULES.map(()=>({}));

wer?'disabled':'')+'>Check answer</button><button class="btn" id="next">Next question / topic →</button><button class="btn" id="skipQuestion">Skip question</button></div><div class="review"><h3>Ask a clarification</h3><p class="muted tiny">Search a concept for an immediate prepared explanation, or copy your question into ChatGPT for a conversational answer.</p><input id="searchTerm" style="width:100%;padding:10px;border:1px solid #d9deea;border-radius:8px" placeholder="e.g. JWT, index, event loop"><div class="actions"><button class="btn" id="explainTerm">Explain term</button></div><div id="helpOutput"></div><label for="notes"><b>Your question / notes</b></label><textarea id="notes" placeholder="Write a question or your own explanation...">'+safe(state.notes[current]||"")+'</textarea><div class="actions"><button class="btn" id="saveNote">Save note</button><button class="btn" id="copyPrompt">Copy question for ChatGPT</button></div></div></section>';

}
