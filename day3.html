y README"],1,"Distributed traces reveal which dependency drives tail latency.","Advanced"]]},{"title":"Mock Interview & Final Review","time":45,"topic":"Trade-offs, incident response, readiness","terms":[["Trade-off","Benefit gained at a cost.","Latency versus quality.","System design discussion."],["Failure mode","Way a system can fail.","Queue backlog.","Resilience planning."],["Runbook","Operational instructions for incidents.","Restart failed worker.","On-call response."],["Rollback","Restore previously working version.","Deploy earlier image.","Recovery."],["Benchmark","Repeatable performance measurement.","Load test API.","Capacity planning."],["Acceptance criteria","Conditions defining successful behavior.","p95 and accuracy targets.","Release quality."],["Mock interview","Practice under realistic interview constraints.","Explain RAG in two minutes.","Communication readiness."]],"code":"Backend pattern: authenticate → validate → process or enqueue → persist result → observe failures and retries.","questions":[["What should you do first in a system design interview?",["Immediately pick microservices","Clarify requirements and constraints","Write CSS","Pick the most expensive model"],1,"Requirements guide architecture decisions.","Basic"],["A production deployment breaks inference. First safe action?",["Ignore alerts","Assess impact and rollback or mitigate","Delete all logs","Retrain immediately"],1,"Stabilize service, then investigate root cause.","Medium"],["Design a voice-enabled multi-tenant RAG assistant. Best priorities?",["Only model size","Latency, tenant isolation, tool authorization, fallback and observability","No monitoring","Unlimited tool retries"],1,"A complete design addresses correctness, security, reliability and user experience.","Advanced"]]}];

}
