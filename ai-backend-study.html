<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI + Backend Interview Study Studio</title><style>
:root{--bg:#0a101d;--surface:#111c2f;--surface2:#18253c;--line:#293852;--text:#f1f5ff;--muted:#a6b6d0;--accent:#77b8ff;--mint:#63ddba;--gold:#ffc77b;--red:#ff8e96}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#1c3556 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.shell{display:flex;min-height:100vh}.side{width:260px;flex-shrink:0;background:#0c1627e8;border-right:1px solid var(--line);padding:25px 17px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:850;font-size:20px;line-height:1.2;margin:6px 6px 24px}.brand small{display:block;font-weight:500;font-size:12px;margin-top:8px;color:var(--muted)}.nav{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;color:var(--muted);margin:3px 0}.nav.active,.nav:hover{background:#1c3150;color:#fff}.nav span{display:inline-block;width:26px}.sidefoot{font-size:12px;color:var(--muted);margin:22px 10px}.main{width:min(1160px,100%);padding:36px 44px 70px;margin:auto}.eyebrow{color:var(--mint);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}.header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:23px}h1{font-size:clamp(30px,3.5vw,46px);line-height:1.14;letter-spacing:-1.2px;margin:7px 0 10px}h2{font-size:23px;margin:0 0 8px}h3{font-size:17px;margin:4px 0 8px}.sub{color:var(--muted);margin:0 0 22px}.card{background:linear-gradient(145deg,#15233a,#101c30);border:1px solid var(--line);border-radius:17px;padding:23px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{padding:18px}.stat strong{font-size:29px;display:block}.stat span{font-size:12px;color:var(--muted)}.bar{height:9px;background:#293956;border-radius:40px;overflow:hidden;margin:11px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--mint));transition:width .2s}.btn{border:1px solid #426080;border-radius:10px;background:#233b5b;color:white;padding:9px 15px;font-weight:650}.btn:hover{filter:brightness(1.17)}.btn.primary{background:#4787dc;border-color:#4787dc}.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}.btn.good{background:#126b59;border-color:#218d75}.btn.danger{background:#51313e;border-color:#734050}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.muted{color:var(--muted)}.pill{display:inline-block;padding:4px 9px;border:1px solid #3c5470;background:#20334c;border-radius:22px;color:#cbe1ff;font-size:11px;margin-right:7px}.level-Beginner{color:var(--mint)}.level-Intermediate{color:var(--gold)}.level-Advanced{color:var(--red)}.searchbar,.field{background:#0c1829;color:var(--text);border:1px solid #3a4b66;padding:11px 13px;border-radius:10px;min-width:0}.searchbar{width:100%}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:15px 0 22px}.term{padding:20px;transition:transform .15s}.term:hover{transform:translateY(-2px)}.term p{color:var(--muted);margin:6px 0 12px}.example{background:#0b1929;border-left:3px solid var(--mint);padding:12px 15px;border-radius:6px;margin:13px 0}.example b{color:var(--mint)}.question{font-size:24px;font-weight:740;line-height:1.35;margin:20px 0}.options{display:grid;gap:10px}.option{width:100%;text-align:left;background:#14233a;color:var(--text);border:1px solid #3b4e68;border-radius:12px;padding:15px}.option:hover:not(:disabled){border-color:var(--accent)}.option.selected{border-color:var(--accent);background:#254267}.option.correct{border-color:var(--mint);background:#153e37}.option.incorrect{border-color:var(--red);background:#462d3e}.option:disabled{cursor:default}.feedback{padding:16px;border:1px solid #3a5770;background:#122c40;border-radius:12px;margin-top:16px}.flip{border:1px solid #426082;background:linear-gradient(145deg,#1b3454,#13243d);border-radius:20px;min-height:270px;width:100%;color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:30px;text-align:center}.flip h2{font-size:30px}.flip .answer{font-size:20px;max-width:700px}.flip:hover{border-color:var(--accent)}.topic{padding:16px;border:1px solid var(--line);border-radius:13px;background:#14233a;text-align:left;color:var(--text);width:100%}.topic:hover{border-color:var(--accent)}.topic strong{display:block;margin-top:5px}.topic small{color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#081321;border:1px solid var(--line);padding:16px;border-radius:12px;color:#c7e2ff;font-size:12px;line-height:1.55}details{border-top:1px solid var(--line);margin-top:13px;padding-top:12px}summary{cursor:pointer;color:var(--accent);font-weight:700}.hidden{display:none!important}.small{font-size:13px}.progressrow{padding:9px 0;border-bottom:1px solid var(--line)}.right{margin-left:auto}.sticky-top{display:none}.quote{font-size:18px;border-left:3px solid var(--gold);padding-left:20px;color:#e1eafd}.modal{position:fixed;inset:0;background:#06101cd9;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{max-width:900px;width:100%;max-height:85vh;overflow:auto;background:var(--surface);padding:23px;border:1px solid var(--line);border-radius:16px}.kbd{font:12px monospace;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);margin-right:6px}textarea{width:100%;min-height:145px;resize:vertical}.divider{height:1px;background:var(--line);margin:22px 0}.empty{padding:34px;text-align:center;color:var(--muted)}@media(max-width:900px){.side{width:200px}.main{padding:30px 20px}.stats{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}}@media(max-width:650px){.shell{display:block}.side{position:relative;height:auto;width:auto;padding:12px;display:flex;gap:6px;overflow-x:auto;align-items:center}.brand{font-size:15px;min-width:145px;margin:0}.brand small,.sidefoot{display:none}.nav{min-width:max-content;margin:0;padding:9px 10px;font-size:13px}.nav span{display:none}.main{padding:24px 14px 60px}.two,.three{grid-template-columns:1fr}.header{align-items:flex-start}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:23px}.controls{grid-template-columns:1fr}.controls input{grid-column:auto}.card{padding:17px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">✦ Study Studio<small>Backend • AI • RAG interview prep</small></div><button class="nav active" data-page="home"><span>⌂</span> Overview</button><button class="nav" data-page="learn"><span>▤</span> Learn topics</button><button class="nav" data-page="flash"><span>▣</span> Flashcards</button><button class="nav" data-page="quiz"><span>✓</span> Quiz mode</button><button class="nav" data-page="interview"><span>♬</span> Mock interview</button><button class="nav" data-page="architecture"><span>◇</span> Architecture lab</button><button class="nav" data-page="progress"><span>◷</span> My progress</button><a href="/" style="display:block;color:#77b8ff;font-size:13px;margin:16px 11px">← Learning Studio home</a><div class="sidefoot">Standalone HTML • works offline<br>Progress saved on this browser</div></aside><main class="main" id="app"></main></div><div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h2>Original uploaded notes</h2><button class="btn ghost" onclick="closeModal()">Close ✕</button></div><p class="muted small">Reference text preserved from your upload. Examples in the study experience are explanatory additions, not claims from your file.</p><pre id="original"></pre></div></div><script>
const TERMS=[{"cat": "Backend", "level": "Beginner", "name": "Fastify", "definition": "A fast Node.js framework for building HTTP APIs, with schema validation, serialization, and structured logging.", "example": "A POST /orders endpoint validates an order before saving it.", "analogy": "Cashier takes the order; kitchen handles long work.", "why": "Use for low-overhead backend APIs.", "question": "What should a Fastify route usually do with a long PDF processing task?", "options": ["Process the entire PDF before responding", "Queue the task for a worker", "Store the PDF only in a cookie", "Open a WebSocket for every request"], "answer": 1, "explanation": "Send long jobs to a background worker so requests respond quickly."}, {"cat": "Backend", "level": "Beginner", "name": "PostgreSQL", "definition": "A relational ACID database for durable structured records; pgvector adds vector similarity capabilities.", "example": "Persist users, invoices, document chunks, and embeddings.", "analogy": "Permanent accounting ledger.", "why": "Use for reliable transactional state.", "question": "Where should a durable order record be stored?", "options": ["Valkey Pub/Sub", "An in-memory JavaScript variable", "PostgreSQL", "Browser sessionStorage"], "answer": 2, "explanation": "PostgreSQL provides durable database storage and transactions."}, {"cat": "Backend", "level": "Beginner", "name": "Valkey / Redis", "definition": "An in-memory key-value datastore used for caching, queues, and fast messaging.", "example": "Cache a user session or hold BullMQ job metadata.", "analogy": "Kitchen ticket rail and intercom.", "why": "Fast temporary data and messaging; not a substitute for durable business records.", "question": "Which tool is best suited for ultra-fast ephemeral caching?", "options": ["PostgreSQL migrations", "Valkey", "Git history", "HTML"], "answer": 1, "explanation": "Valkey is optimized for fast key/value access in memory."}, {"cat": "Backend", "level": "Beginner", "name": "BullMQ", "definition": "A Redis-compatible-backed job queue library that schedules, retries, and distributes background jobs.", "example": "Enqueue a 500-page PDF ingestion task and retry on timeout.", "analogy": "Smart order board.", "why": "Protect user-facing requests from long tasks.", "question": "Which feature helps BullMQ handle temporary job failures?", "options": ["CSS variables", "Retries with backoff", "Browser cookies", "Database sharding"], "answer": 1, "explanation": "Retries with exponential backoff can recover transient failures."}, {"cat": "Backend", "level": "Beginner", "name": "Worker Service", "definition": "A separate process that consumes queued jobs and performs long-running work.", "example": "Generate embeddings after an upload request returns 202.", "analogy": "Chef cooks while cashier accepts more orders.", "why": "Scale slow jobs separately from API servers.", "question": "Who executes a job after the API enqueues it?", "options": ["CORS middleware", "Background worker", "Browser HTML parser", "Read replica"], "answer": 1, "explanation": "A worker reads the queue and executes its job handler."}, {"cat": "Backend", "level": "Intermediate", "name": "Relay Service", "definition": "A process that propagates persisted outbox events or messages to queues and consumers.", "example": "Publish an OrderCreated event saved alongside a new order.", "analogy": "Food runner transports completed orders.", "why": "Decouple database writes and downstream events.", "question": "What does an outbox relay read?", "options": ["CSS style rules", "Pending rows in outbox_events", "JWT public claims only", "Browser localStorage"], "answer": 1, "explanation": "The relay moves durable outbox records into messaging infrastructure."}, {"cat": "Backend", "level": "Beginner", "name": "WebSockets vs SSE", "definition": "WebSockets are full-duplex connections; SSE streams one-way updates from server to browser over HTTP.", "example": "Use SSE for AI text output; WebSockets for bidirectional collaborative editing.", "analogy": "Live table service giving updates.", "why": "Select a transport that matches communication direction.", "question": "Best default for streaming LLM text to a browser?", "options": ["SSE", "Database sharding", "Bcrypt", "A cron migration"], "answer": 0, "explanation": "SSE provides a straightforward server-to-client token stream."}, {"cat": "Backend", "level": "Advanced", "name": "Sharding", "definition": "Splitting data across independent database servers using a shard key.", "example": "Route tenant A records to shard 1 and tenant B to shard 2.", "analogy": "Different filing cabinets for different groups.", "why": "Used when one primary cannot meet capacity needs.", "question": "When is sharding typically warranted?", "options": ["Before the first table exists", "When a single primary cannot handle scale", "Whenever a query uses JOIN", "Whenever a job fails"], "answer": 1, "explanation": "Sharding adds complexity; start with indexing, pooling, and replicas where appropriate."}, {"cat": "Backend", "level": "Beginner", "name": "Monorepo", "definition": "One repository containing multiple services and shared packages.", "example": "apps/api, apps/worker, apps/realtime and packages/db.", "analogy": "One blueprint for many stations.", "why": "Share types and coordinated versions.", "question": "What belongs in a monorepo?", "options": ["Only HTML files", "Only the API service", "Services and shared packages", "Only deployment credentials"], "answer": 2, "explanation": "A monorepo can manage several apps and packages together."}, {"cat": "Backend", "level": "Intermediate", "name": "Promise.all / Parallel I/O", "definition": "Runs independent asynchronous operations concurrently instead of awaiting each sequentially.", "example": "Fetch profile and permissions at once when neither depends on the other.", "analogy": "Two staff members handle separate requests simultaneously.", "why": "Reduce combined wait time of independent I/O.", "question": "Two independent 200 ms requests run with Promise.all. Approximate completion?", "options": ["400 ms", "200 ms", "0 ms always", "800 ms"], "answer": 1, "explanation": "Both requests overlap. Actual latency includes overhead and depends on conditions."}, {"cat": "Security", "level": "Beginner", "name": "Password Hashing", "definition": "Store a one-way password hash with per-password salt using Argon2id or bcrypt, never plaintext.", "example": "Compare entered password to saved Argon2id hash.", "analogy": "A one-way fingerprint rather than a copied key.", "why": "Limit damage when credential databases leak.", "question": "Which is a suitable password storage strategy?", "options": ["Plaintext", "Base64 encoding", "Argon2id with salt", "MD5 without salt"], "answer": 2, "explanation": "Use a password-focused, salted hashing function."}, {"cat": "Security", "level": "Intermediate", "name": "JWT + HttpOnly Cookies", "definition": "A JWT contains signed claims; an HttpOnly cookie prevents browser JavaScript from directly reading the cookie.", "example": "Store a signed login token in Secure, HttpOnly, SameSite cookie.", "analogy": "Sealed ID card kept out of script reach.", "why": "Protect auth credentials; still enforce CSRF protections and validate claims.", "question": "What does HttpOnly mainly prevent?", "options": ["All XSS attacks", "JavaScript reading that cookie", "All CSRF attacks", "JWT expiration"], "answer": 1, "explanation": "HttpOnly blocks JS access to the cookie, but does not remove all XSS or CSRF risks."}, {"cat": "Security", "level": "Beginner", "name": "Authentication vs RBAC", "definition": "Authentication establishes who the caller is; role-based authorization determines which actions that caller may perform.", "example": "Logged-in viewer gets 403 on /admin/reindex; unauthenticated caller gets 401.", "analogy": "Identity badge vs permission to enter the kitchen.", "why": "Separate identity checks from permission rules.", "question": "A logged-in user lacks admin permission. Return?", "options": ["200", "301", "401", "403"], "answer": 3, "explanation": "403 Forbidden means authenticated, but insufficient privileges."}, {"cat": "Security", "level": "Intermediate", "name": "CORS & Rate Limiting", "definition": "CORS controls which browser origins may read cross-origin responses; rate limiting caps request frequency.", "example": "Allow your frontend origin and limit /login requests.", "analogy": "Door policy plus crowd-control counter.", "why": "Reduce browser cross-origin exposure and abusive request volume.", "question": "Does CORS alone prevent curl or server-side API abuse?", "options": ["Yes", "No", "Only over HTTPS", "Only with JWT"], "answer": 1, "explanation": "CORS is a browser enforcement mechanism; server-side auth and limits still matter."}, {"cat": "Security", "level": "Advanced", "name": "Tenant Isolation", "definition": "Enforce tenant ownership in every data lookup and tool action, not merely an LLM instruction.", "example": "SELECT ... WHERE tenant_id = $1 and verify tool permissions.", "analogy": "Separate locked cabinets for each customer.", "why": "Avoid cross-tenant data leaks.", "question": "Where should multi-tenant access rules be enforced?", "options": ["Only in the prompt", "Database and application authorization", "Only in CSS", "Only via a frontend toggle"], "answer": 1, "explanation": "Security boundaries belong in trusted server-side checks and data queries."}, {"cat": "Security", "level": "Intermediate", "name": "PII Redaction", "definition": "Detect and minimize or mask personally identifiable information before exposing it to external processors.", "example": "Replace contact details and financial identifiers in prompts where practical.", "analogy": "Cover customer details on a ticket before forwarding it.", "why": "Reduce privacy exposure and comply with data policies.", "question": "Which is PII?", "options": ["A CSS selector", "A phone number", "A generic HTTP verb", "A SQL keyword"], "answer": 1, "explanation": "Phone numbers can identify individuals."}, {"cat": "Operations", "level": "Intermediate", "name": "Transactional Outbox", "definition": "Write a business record and an outbox event atomically in the same database transaction; asynchronously publish the event.", "example": "Create order + OrderCreated event together, then relay publishes later.", "analogy": "Write the receipt before the runner delivers it.", "why": "Prevent losing the event after a successful DB commit; delivery is commonly at-least-once.", "question": "What must be in the same ACID transaction?", "options": ["Order and outbox event", "Order and browser refresh", "Queue and CSS", "JWT and SSE"], "answer": 0, "explanation": "The transaction guarantees the business change and event record persist together."}, {"cat": "Operations", "level": "Intermediate", "name": "fastify.inject()", "definition": "Runs Fastify HTTP request tests in-process without binding a network port.", "example": "Test that /admin/reindex returns 403 for a viewer.", "analogy": "A rehearsal at the counter without opening the restaurant.", "why": "Fast route, schema, and auth tests.", "question": "What does fastify.inject() avoid?", "options": ["Writing any assertions", "Opening a live network port", "Validating routes", "Testing status codes"], "answer": 1, "explanation": "It invokes application routes directly in memory."}, {"cat": "Operations", "level": "Intermediate", "name": "Pino Structured Logging", "definition": "Emits structured JSON log events that can include request identifiers, levels and safe fields.", "example": "Log reqId and endpoint while redacting Authorization and password.", "analogy": "Consistent kitchen incident logbook.", "why": "Trace requests without leaking secrets.", "question": "What should be redacted from structured logs?", "options": ["HTTP method", "Password and Authorization header", "Request duration", "Status code"], "answer": 1, "explanation": "Sensitive credentials must not be written to logs."}, {"cat": "Operations", "level": "Advanced", "name": "Read Replicas & Pooling", "definition": "Connection pooling reuses database connections; read replicas serve some read traffic separately from the primary.", "example": "pg.Pool for connections, replicas for reporting queries.", "analogy": "More ledger readers rather than a second cashier writing orders.", "why": "Improve connection efficiency and read capacity.", "question": "Which technique primarily helps scale heavy SELECT traffic?", "options": ["Read replicas", "JWT hashing", "CORS", "SSE"], "answer": 0, "explanation": "Read replicas can handle appropriate read workloads; replication lag remains a consideration."}, {"cat": "AI / RAG", "level": "Beginner", "name": "Transformer & Self-Attention", "definition": "A neural network architecture in which attention weights relationships between tokens in context.", "example": "Resolve that “it” refers to PostgreSQL in a sentence about database indexing.", "analogy": "Readers pay attention to relevant words in the paragraph.", "why": "Foundation of many modern language models.", "question": "What does self-attention help a model do?", "options": ["Configure rate limits", "Model relationships between tokens", "Run Postgres migrations", "Hash passwords"], "answer": 1, "explanation": "Attention computes context-dependent interactions among tokens."}, {"cat": "AI / RAG", "level": "Beginner", "name": "RAG", "definition": "Retrieval-Augmented Generation fetches relevant source material and supplies it as context before generating an answer.", "example": "Search internal policy docs, then answer with citations.", "analogy": "Open the reference binder before answering a question.", "why": "Ground an LLM in external data rather than relying only on training.", "question": "What is the key extra step in RAG?", "options": ["Delete user history", "Retrieve relevant source passages", "Shard every database", "Disable prompts"], "answer": 1, "explanation": "Retrieval adds relevant evidence to the prompt."}, {"cat": "AI / RAG", "level": "Beginner", "name": "Chatbot vs Copilot vs Automation", "definition": "A chatbot answers; a copilot can take authorized in-product actions; automation executes an event-triggered workflow.", "example": "Chatbot explains an invoice; copilot drafts a reply; automation schedules follow-ups.", "analogy": "Advisor vs assistant vs scheduled team.", "why": "Choose the correct control model for a use case.", "question": "Which best matches an action-taking assistant with user permissions?", "options": ["Copilot", "Static PDF", "Database index", "Read replica"], "answer": 0, "explanation": "A copilot uses authorized tools to perform actions."}, {"cat": "AI / RAG", "level": "Beginner", "name": "Fixed-Size Chunking", "definition": "Split text every N tokens, optionally adding overlap between chunks.", "example": "Chunks of 500 tokens with 50-token overlap.", "analogy": "Cut a document into equal strips.", "why": "Simple baseline, but can split sentences and ideas.", "question": "Main tradeoff of fixed-size chunking?", "options": ["No storage needed", "May break semantic boundaries", "Requires LangGraph", "Cannot embed text"], "answer": 1, "explanation": "Arbitrary boundaries can separate related content."}, {"cat": "AI / RAG", "level": "Intermediate", "name": "Recursive Chunking", "definition": "Try larger separators, then smaller ones, to preserve text structure within a token budget.", "example": "Split paragraphs, then lines, then sentences if needed.", "analogy": "Cut chapters into paragraphs before individual lines.", "why": "Useful general-purpose default for prose.", "question": "What is the core principle of recursive chunking?", "options": ["Split only at byte 100", "Use hierarchical separators", "Always require an LLM", "Always use a database transaction"], "answer": 1, "explanation": "It preserves larger natural boundaries when possible."}, {"cat": "AI / RAG", "level": "Intermediate", "name": "Structure-Aware Chunking", "definition": "Split by headings, HTML sections, or syntax tree boundaries while carrying document metadata.", "example": "Keep each Markdown heading section together and attach its title.", "analogy": "Sort reference cards by chapter.", "why": "Especially useful for technical and structured documentation.", "question": "Which document benefits most from structure-aware chunks?", "options": ["A Markdown API guide", "Random noise", "A URL token alone", "A numeric timestamp"], "answer": 0, "explanation": "Headings and code structures carry useful context."}, {"cat": "AI / RAG", "level": "Intermediate", "name": "Semantic Chunking", "definition": "Compute text embeddings and split where semantic similarity changes sharply.", "example": "Break an interview transcript when the topic shifts from auth to scaling.", "analogy": "Group notes by changes in topic.", "why": "Can preserve meaning at the cost of extra embedding work.", "question": "What triggers a semantic chunk boundary?", "options": ["Low relatedness between adjacent text", "Every 40 characters", "Each SQL transaction", "Every model token"], "answer": 0, "explanation": "Semantic similarity signals topic shifts."}, {"cat": "AI / RAG", "level": "Advanced", "name": "Parent–Child Retrieval", "definition": "Index small child passages but return their larger parent section to give the model broader context.", "example": "Retrieve a 150-token match, then provide its 1,000-token parent.", "analogy": "Find a sentence in an index, then open its full page.", "why": "Balance precise retrieval and useful context.", "question": "In parent–child retrieval, what is typically embedded for search?", "options": ["Only entire books", "Small child chunks", "Only user passwords", "Only server logs"], "answer": 1, "explanation": "Small child chunks improve retrieval granularity."}, {"cat": "AI / RAG", "level": "Advanced", "name": "Contextual Retrieval", "definition": "Add brief document/section context to chunks before embedding and retrieval.", "example": "Prefix “This excerpt is from Q3 revenue reporting” to an ambiguous chunk.", "analogy": "Add a label to a torn-out page.", "why": "Disambiguate fragments that lack standalone context.", "question": "Why prepend context to a chunk?", "options": ["To delete its meaning", "To clarify references and topic", "To eliminate all token costs", "To avoid tenant filtering"], "answer": 1, "explanation": "Context helps retrieval match otherwise ambiguous passages."}, {"cat": "AI / RAG", "level": "Advanced", "name": "Agentic / LLM Chunking", "definition": "Use an LLM to rewrite or extract standalone propositions from source text.", "example": "Convert “It requires a primary key” into an explicit referenced statement.", "analogy": "Editor rewrites notes so each makes sense alone.", "why": "High processing cost but can improve self-contained retrieval.", "question": "What is a typical downside of LLM-based chunking?", "options": ["Higher inference cost", "Requires no computation", "Cannot handle pronouns", "Never generates errors"], "answer": 0, "explanation": "LLM processing adds time/cost and should be quality-checked."}, {"cat": "AI / RAG", "level": "Intermediate", "name": "pgvector + Hybrid Search", "definition": "Combine semantic embedding similarity with keyword/full-text matching, often followed by reranking.", "example": "Search by topic and exact invoice ID; rerank top candidates.", "analogy": "Use both a topic index and an exact-name index.", "why": "Vector-only search can miss exact identifiers or acronyms.", "question": "Why add keyword search to vector search?", "options": ["To avoid authorization", "To find exact IDs and terms", "To eliminate all embeddings", "To run jobs faster"], "answer": 1, "explanation": "Lexical matching is useful for exact strings and identifiers."}, {"cat": "AI / RAG", "level": "Intermediate", "name": "Reranking", "definition": "Score retrieved candidates more precisely and pass only the most relevant to the model.", "example": "Retrieve 20 passages, rerank, keep the best 4.", "analogy": "A senior reviewer sorts the shortlist.", "why": "Improve context quality and limit tokens.", "question": "What is reranking used for?", "options": ["Ordering candidates by relevance", "Hashing passwords", "Delivering email", "Sharding tables"], "answer": 0, "explanation": "A reranker selects the strongest evidence among retrieved candidates."}, {"cat": "AI / RAG", "level": "Intermediate", "name": "SSE Token Streaming", "definition": "Send generated tokens incrementally in a server-to-client HTTP event stream.", "example": "Update a chat window word by word while the LLM generates.", "analogy": "A waiter announces each ready item.", "why": "Improve perceived responsiveness and time to first token.", "question": "Which communication direction does SSE support natively?", "options": ["Client ↔ server equally", "Server → client", "Database → disk only", "Worker → queue only"], "answer": 1, "explanation": "SSE is a one-way server-to-client event channel."}, {"cat": "AI / RAG", "level": "Intermediate", "name": "Semantic Cache", "definition": "Cache an answer based on a normalized request or a semantic match, with appropriate tenant isolation.", "example": "Reuse an approved response for a repeated company FAQ.", "analogy": "Reusing a prepared response for the same question.", "why": "Reduce latency and LLM costs; invalidate on data changes.", "question": "What must be considered in an enterprise semantic cache?", "options": ["Tenant scope and data freshness", "Only font choice", "Only HTTP port", "Only CSS themes"], "answer": 0, "explanation": "Cross-tenant reuse or stale answers can be unsafe."}, {"cat": "Agents", "level": "Beginner", "name": "LangChain", "definition": "A toolkit for connecting models, prompts, tools, and retrievers.", "example": "Build a straightforward question-answering chain.", "analogy": "Common connectors and ut : "Evaluation", "level": "Intermediate", "name": "Answer Relevance", "definition": "Measures whether the answer actually addresses the user question.", "example": "A user asks refund eligibility and receives the eligibility criteria.", "analogy": "Did we answer what the customer asked?", "why": "Prevent off-topic responses.", "question": "A well-cited answer about the wrong topic fails which measure?", "options": ["Answer relevance", "Password hashing", "Replication lag", "Chunk overlap"], "answer": 0, "explanation": "Even grounded content must address the question."}, {"cat": "Evaluation", "level": "Advanced", "name": "Golden Dataset & CI Evaluation", "definition": "A reviewed set of representative questions and expected evidence/answers tested repeatedly in CI.", "example": "Run 50 known RAG questions after retriever changes.", "analogy": "Practice exam with an answer key.", "why": "Catch quality regressions before deployment.", "question": "What is the main value of a golden dataset?", "options": ["Repeatable regression checks", "Replacing all human oversight", "Encrypting the database", "Disabling evaluation"], "answer": 0, "explanation": "A stable test set makes changes comparable over time."}, {"cat": "Operations", "level": "Advanced", "name": "Retries, Backoff & Model Fallback", "definition": "Retry transient failures with increasing delays; fall back to an alternative model/provider where allowed.", "example": "Worker retries 429 errors with backoff, then uses configured fallback.", "analogy": "Try again after a short delay instead of overwhelming the kitchen.", "why": "Improve reliability without retry storms.", "question": "Why use exponential backoff?", "options": ["To increase request bursts", "To space retries after failure", "To store passwords", "To replace RBAC"], "answer": 1, "explanation": "Progressively increasing delays reduce pressure on an unhealthy dependency."}, {"cat": "Security", "level": "Advanced", "name": "Structured Outputs & Token Budg const SOURCE="\nPart 1: Scalable Backend & Microservices Architecture\n\n\n1. Core Infrastructure Definitions & Restaurant Analogy\n\n\nComponent\tDefinition\tPlain-English Analogy\nFastify\tHigh-performance, low-overhead Node.js web framework with built-in JSON Schema validation, fast serialization, and Pino structured logging.\tThe Cashier: Takes customer orders quickly at the front counter and hands out buzzers without cooking the food itself.\nPostgreSQL\tRelational ACID database storing permanent structured data, plus vector embeddings via pgvector.\tThe Accounting Ledger: Permanent filing cabinet on disk that remembers every user, order, and vector safely.\nValkey / Redis\tOpen-source, ultra-fast in-memory (RAM) key-value store (Valkey is the Linux Foundation BSD-licensed fork of Redis).\tThe Kitchen Ticket Rail & Intercom: Holds temporary live tasks and broadcasts instant shout-outs across rooms.\nBullMQ\tDistributed Node.js job queue library backed by Valkey/Redis supporting retries, backoff, rate limiting, and scheduled flows.\tThe Smart Order Board: Tracks every pending job, retries failed dishes automatically, and prevents kitchen overload.\nWorker Service\tSeparate background process that consumes jobs from BullMQ and executes slow, CPU/IO-heavy tasks asynchronously.\tThe Chef in the Kitchen: Cooks heavy meals (PDF parsing, embeddings, AI workflows) in the back without blocking customers.\nRelay Service\tLightweight service that listens to database changes (Outbox pattern) or Valkey Pub/Sub events and forwards them to other services/clients.\tThe Food Runner: Watches the kitchen window and delivers finished dishes straight to the customer's table.\nWebSockets & SSE\tWebSockets: Persistent two-way tunnel (ws://). SSE (Server-Sent Events): One-way server-to-client HTTP stream.\tLive Table Service: Pushes live notifications (WebSockets) or streams AI words token-by-token (SSE) without page refreshes.\nSharding\tSplitting massive datasets across multiple separate database servers using a shard key (e.g., tenant_id or region).\tMultiple Filing Cabinets: Splitting 100M folders alphabetically across 4 separate cabinets in different rooms.\nMonorepo\tStoring multiple deployable services (apps/api, apps/worker, apps/realtime) and shared packages (packages/db) in one Git repo.\tOne Master Blueprint: All teams share the same ingredient definitions while operating separate stations in production.\n\n\n2. Essential Backend Patterns & Code Examples\n\n\nA. Non-Blocking async/await & Parallel Execution\n\nNode.js runs on a single-threaded Event Loop. Always run independent I/O calls (Valkey, PostgreSQL, LLM APIs) in parallel using Promise.all():\njavascript\n// ❌ SLOW (Sequential): 200ms + 200ms = 400ms\nconst profile = await getUserProfile(userId);\nconst permissions = await getUserPermissions(userId);\n\n// ✅ FAST (Parallel): ~200ms total\nconst [profile, permissions] = await Promise.all([\n  getUserProfile(userId),\n  getUserPermissions(userId)\n]);\nUse code with caution.\n\nB. Security, Auth, RBAC, CORS & Rate Limiting (Fastify)\n\n• Password Hashing: Always use one-way hashing with automatic salts (argon2id or bcrypt)—never plain text.\n• JWT + HTTP-Only Cookies: Sign user claims ({ id, role, tenantId }) in a JWT and store it in an httpOnly: true, secure: true, sameSite: 'lax' cookie so browser JavaScript cannot steal it via XSS.\n• Hooks (onRequest / preHandler): Verify identity (401 Unauthorized) and enforce Role-Based Access Control (403 Forbidden).\n• CORS & Rate Limiting: Lock down origins (@fastify/cors) and protect endpoints from brute-force/token-burn attacks (@fastify/rate-limit backed by Valkey).\njavascript\n// Fastify Auth + Role Guard + Rate Limit Example\nfastify.decorate('authenticate', async (request, reply) => {\n  try {\n    await request.jwtVerify(); // Reads HTTP-only cookie & sets request.user\n  } catch {\n    return reply.code(401).send({ error: 'Unauthorized' });\n  }\n});\n\nconst requireAdmin = async (request, reply) => {\n  if (request.user.role !== 'admin') {\n    return reply.code(403).send({ error: 'Admin access required' });\n  }\n};\n\nfastify.post('/admin/reindex', {\n  onRequest: [fastify.authenticate, requireAdmin],\n  config: { rateLimit: { max: 5, timeWindow: '1 minute' } }\n}, async (request) => {\n  await indexQueue.add('full-reindex', { tenantId: request.user.tenantId });\n  return { status: 'queued' };\n});\nUse code with caution.\n\nC. Transactional Outbox Relay (Zero Lost Events)\n\nTo prevent losing events if PostgreSQL saves an order but Valkey crashes 1ms later:\n1. Fastify writes both the business record (orders) and an event row (outbox_events) inside one PostgreSQL ACID transaction.\n2. A Relay Service watches outbox_events, pushes the event to BullMQ / Valkey Pub/Sub, and marks the row as processed.\n\nD. Production Operations: Testing, Logging & Scaling\n\n• Fast In-Memory Testing (fastify.inject()): Tests HTTP routes, schemas, and auth hooks directly in memory without opening a live network port.\n• Structured Logging (Pino): Outputs JSON logs with unique reqId traces and redact: ['req.headers.authorization', 'body.password'] so secrets never leak.\n• Scaling Progression:\n\t1. 0–50k users: Single PostgreSQL + B-Tree/HNSW Indexes + Connection Pooling (pg.Pool) + Valkey cache.\n\t2. 50k–500k users: Add Read Replicas for heavy SELECT queries.\n\t3. Millions of users / TBs: Introduce Sharding only when a single primary node can no longer handle write throughput or storage.\n\nPart 2: Production Generative AI & RAG Systems\n\n\n1. Core AI Architecture Definitions\n\n• Transformers: Deep learning architecture (\"Attention Is All You Need\") using Self-Attention to process all tokens in parallel and weigh relationships across long contexts.\n• RAG (Retrieval-Augmented Generation): Connecting an LLM to private enterprise knowledge bases so answers are grounded in retrieved facts with citations rather than hallucinations.\n• Copilots vs. Chatbots vs. Workflow Automation:\n\t• Chatbot (RAG): Answers questions from company docs with real-time SSE token streaming.\n\t• Copilot: Embedded in the UI; uses Tool/Function Calling with the user's RBAC permissions to take actions (e.g., querying invoices, drafting emails).\n\t• Workflow Automation: Event-driven background agents (BullMQ + LangGraph) that execute multi-step pipelines with retries and Human-in-the-Loop (HITL) approvals.\n\n2. RAG Chunking Strategies Comparison\n\n\nChunking Type\tMechanism\tSpeed / Cost\tAccuracy\tWhen to Use\nFixed-Size\tSplits strictly every N tokens with 10–15% overlap.\tFastest / Free\tLow\tQuick prototypes, raw logs.\nRecursive (Default)\tSplits by prioritized separators (\\n\\n → \\n → .  →  ).\tVery Fast / Free\tGood\t80% of general RAG apps (articles, standard PDFs).\nStructure / Markdown\tSplits on # headings, HTML tags, or code ASTs; keeps heading metadata.\tVery Fast / Free\tHigh\tTechnical docs, Notion, legal contracts, codebases.\nSemantic\tEmbeds every sentence and splits when cosine similarity drops sharply.\tModerate / Low\tHigh\tUnstructured transcripts, books, podcasts.\nParent-Child (Small-to-Big)\tSearches tiny Child chunks (~150 tokens) in pgvector; passes larger Parent chunks (~1,000 tokens) to LLM.\tFast / Low\tVery High\tProduction enterprise RAG needing precision + rich context.\nContextual Retrieval\tFast LLM prepends a 1–2 sentence document/section summary to every chunk before embedding.\tSlower / Moderate\tVery High\tFinancial reports, multi-tenant docs with pronouns.\nAgentic / LLM-Based\tLLM extracts standalone propositions and resolves all pronouns (\"it\" → \"PostgreSQL\").\tSlowest / High\tHighest\tSmall, high-stakes compliance/medical rulebooks.\n\n\n3. End-to-End Production RAG + Copilot + Worker Blueprint\n\nShow Code\nDownload diagram SVG\n\nProduction RAG Streaming & Hybrid Search Pattern\n\njavascript\nfastify.post('/chat/stream', { onRequest: [fastify.authenticate] }, async (request, reply) => {\n  const { question } = request.body;\n  const { tenantId } = request.user;\n\n  // 1. PII Redaction before external LLM/Embedding calls\n  const safeQuestion = redactPII(question);\n\n  // 2. Check Semantic Cache in Valkey (2ms response, $0 token cost)\n  const cached = await valkey.get(`rag:${tenantId}:${hash(safeQuestion)}`);\n  if (cached) return { answer: cached, cached: true };\n\n  // 3. Hybrid Search in PostgreSQL (Vector similarity + Full-Text Keyword search)\n  const queryVector = await embedText(safeQuestion);\n  const candidates = await db.query(\n    `SELECT id, content, source_file, page_num\n     FROM document_chunks\n     WHERE tenant_id = $1\n     ORDER BY (embedding <=> $2::vector) * 0.7 + (1 - ts_rank(tsv, plainto_tsquery($3))) * 0.3 ASC\n     LIMIT 20`,\n    [tenantId, JSON.stringify(queryVector), safeQuestion]\n  );\n\n  // 4. Rerank top 20 down to top 4 most relevant chunks\n  const topChunks = await rerank(safeQuestion, candidates, 4);\n\n  // 5. Stream tokens immediately via SSE\n  reply.raw.writeHead(200, { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache' });\n\n  const stream = await llm.stream({\n    system: `Answer ONLY from the provided context and cite [source_file, p. page_num].\\nContext:\\n${JSON.stringify(topChunks)}`,\n    user: safeQuestion\n  });\n\n  for await (const token of stream) {\n    reply.raw.write(`data: ${JSON.stringify({ token })}\\n\\n`);\n  }\n  reply.raw.write('data: [DONE]\\n\\n');\n  reply.raw.end();\n});\nUse code with caution.\n\n4. AI Orchestration: LangChain vs. LangGraph vs. LlamaIndex\n\n\nFramework\tCore Purpose\tKey Feature for Production\nLangChain\tGeneral LLM glue & standard components (models, prompts, splitters, tools).\tRapid prototyping & standardized provider abstractions.\nLangGraph\tStateful Graph orchestration with cycles, branching, and persistent memory.\tPostgreSQL Checkpointing (survives crashes) + Human-in-the-Loop pause/resume.\nLlamaIndex\tSpecialized data ingestion, indexing, and advanced RAG retrieval engine.\tComplex document parsing, Parent-Child indexing, and query engines.\n\n• What is a Stateful Graph? A workflow of Nodes (LLM calls, SQL execution, tool calls) and Conditional Edges sharing a persistent State object—allowing agents to loop backward to self-correct errors (e.g., fixing a broken SQL query) or pause for human approval.\n\n5. Evaluating RAG Pipelines & Enterprise Safeguards\n\n\nRAG Evaluation (The RAG Triad)\n\nSplit evaluation into Retrieval and Generation using a 50-question Golden Dataset in CI/CD (via RAGAS, Promptfoo, or Langfuse):\n1. Context Recall & Hit Rate@K (Retrieval): Did pgvector find the right source document in the top K chunks?\n2. Context Precision (Retrieval): Were the top retrieved chunks clean and relevant without noisy filler?\n3. Faithfulness / Groundedness (Generation): Scored via LLM-as-a-Judge—is every claim 100% supported by the retrieved context (zero hallucination)?\n4. Answer Relevance (Generation): Did the model directly answer the user's actual question?\n\nEnterprise Security & PII Checklist\n\n• PII (Personally Identifiable Information): Mask names, emails, phone numbers, CNIC/SSNs, and financial IDs before calling external LLMs; configure Zero Data Retention (ZDR) with LLM providers.\n• Strict Multi-Tenant Isolation: Always filter WHERE tenant_id = $1 in SQL/vector queries and enforce RBAC inside Copilot tools—never rely on system prompts for data security.\n• Reliability & Cost Controls: Enforce Structured Outputs (JSON Schema / Zod), configure model fallbacks (e.g., OpenAI → Anthropic), set exponential backoff retries in BullMQ, and cap per-user token budgets in Valkey.\n\nPart 3: Rapid Interview Cheat Sheet (Volga Partners)\n\n• Your Pitch: \"I build end-to-end production AI systems—combining high-throughput Node.js/Python backends, async worker queues, hybrid RAG pipelines, and stateful agent workflows—with a strong focus on low latency, strict tenant security, and measurable evaluation.\"\n• Key Trade-off Phrases to Use:\n\t• \"We decouple slow PDF ingestion and multi-step agents into BullMQ workers while streaming live responses via SSE/WebSockets so Time-To-First-Token stays under a second.\"\n\t• \"We combine pgvector semantic search with keyword search and a Cross-Encoder reranker because pure vector search misses exact IDs and acronyms.\"\n\t• \"We use LangGraph with PostgreSQL checkpointing whenever an agent needs self-correction loops or Human-in-the-Loop approval.\"\nBest of luck in your interview today—you are well prepared!";
const CATS=['All',...new Set(TERMS.map(x=>x.cat))];

let store;try{store=JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){store={}};
store.done=store.done||{};store.quiz=store.quiz||{};store.saved=store.saved||{};store.skipped=store.skipped||{};
let page='home',filter='',category='All',difficulty='All',cardIndex=0,flipped=false,quizIndex=0,answered=false,quizCat='All',quizLevel='All',interviewIndex=0,showAnswer=false,session=0,correctSession=0;

const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const persist=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(store))}catch(e){}};

const label=(x)=>`<span class="pill">${esc(x.cat)}</span><span class="pill level-${x.level}">${esc(x.level)}</span>`;
const header=(tag,title,sub)=>`<div class="eyebrow">${tag}</div><h1>${title}</h1><p class="sub">${sub}</p>`;

function mark(i){store.done[i]=!store.done[i];persist();render()}

function stats(){return `<div class="stats"><div class="card stat"><strong>${TERMS.length}</strong><span>Concepts to master</span></div><div class="card stat"><strong>${numDone()}</strong><span>Topics studied</span></div><div class="card stat"><strong>${Object.keys(store.quiz).filter(k=>store.quiz[k]===true).length}</strong><span>Questions answered correctly</span></div><div class="card stat"><strong>${Math.round(numDone()/TERMS.length*100)}%</strong><span>Course completion</span><div class="bar"><div class="fill" style="width:${100*numDone()/TERMS.length}%"></div></div></div></div>`}
function home(){let cc=CATS.slice(1).map(c=>{let a=TERMS.filter(x=>x.cat===c),d=a.filter(x=>store.done[TERMS.indexOf(x)]).length;return `<button class="topic" onclick="category=${JSON.stringify(c).replace(/"/g,'&quot;')};go('learn')"><small>${a.length} concepts • ${d} studied</small><strong>${esc(c)} →</strong><div class="bar"><div class="fill" style="width:${100*d/a.length}%"></div></div></button>`}).join('');return `${header('Your personal interview prep workspace','Understand it. Practice it. Explain it.','Study each concept in short definitions with examples, then use flashcards, quizzes, and realistic interview prompts.')}${stats()}<div class="card"><div class="row"><div><h2>Continue your preparation</h2><p class="muted">Follow a concept → recall → test → interview sequence.</p></div><button class="btn primary" onclick="go('learn')">Start studying →</button></div><div class="actions"><button class="btn" onclick="go('flash')">Review flashcards</button><button class="btn" onclick="go('quiz')">Take a quiz</button><button class="btn" onclick="go('interview')">Practice speaking</button><button class="btn ghost" onclick="openModal()">Open original notes</button></div></div><h2>Study by subject</h2><div class="three">${cc}</div><div class="card"><h3>How to use it</h3><p>1. Read the short definition, example, and analogy. 2. Mark a concept learned. 3. Flip flashcards to recall without looking. 4. Answer multiple-choice questions and review mistakes. 5. Practice explaining topics out loud in mock interview mode.</p><p class="muted small">Works without an internet connection. Progress is saved to localStorage on this device. No AI API or login is required.</p></div>`}
function selectOpts(arr,sel,fn){return `<select class="field" onchange="${fn}(this.value)">${arr.map(x=>`<option value="${esc(x)}" ${sel===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function learn(){let items=TERMS.map((x,i)=>({...x,i})).filter(x=>(category==='All'||x.cat===category)&&(difficulty==='All'||x.level===difficulty)&&(`${x.name} ${x.definition} ${x.example} ${x.why}`.toLowerCase().includes(filter.toLowerCase())));return `${header('Concept library','Learn one concept at a time','Definitions are short. Examples explain where a concept fits in a real system.') }<div class="controls"><input class="searchbar" id="search" placeholder="Search topics, definitions, examples..." value="${esc(filter)}" oninput="setSearch(this.value)">${selectOpts(CATS,category,'setCategory')}${selectOpts(['All','Beginner','Intermediate','Advanced'],difficulty,'setDifficulty')}</div><p class="muted small">${items.length} of ${TERMS.length} topics shown · Click any topic for a full explanation.</p><div id="term-list">${items.map(x=>`<article class="card term" id="term-${x.i}"><div class="row"><div>${label(x)}</div><div class="actions"><button class="btn ghost" onclick="save(${x.i})">${store.saved[x.i]?'★ Saved':'☆ Save'}</button><button class="btn ${store.done[x.i]?'good':'ghost'}" onclick="mark(${x.i})">${store.done[x.i]?'✓ Studied':'Mark studied'}</button></div></div><h2>${esc(x.name)}</h2><p><b style="color:var(--text)">Definition:</b> ${esc(x.definition)}</p><div class="example"><b>Example:</b> ${esc(x.example)}</div><details><summary>See analogy, when to use it & interview tip</summary><p><b>Analogy:</b> ${esc(x.analogy)}</p><p><b>Why it matters:</b> ${esc(x.why)}</p><p><b>Interview question:</b> ${esc(x.question)}</p><div class="actions"><button class="btn" onclick="quizIndex=${x.i};quizCat='All';quizLevel='All';answered=false;go('quiz')">Practice this question →</button></div></details></article>`).join('')||'<div class="empty">No topics match your filters.</div>'}</div>`}
function setSearch(s){filter=s;let pos=document.activeElement?.selectionStart;render();let el=document.getElementById('search');el.focus();el.setSelectionRange(pos,pos)}
function setCategory(s){category=s;render()}function setDifficulty(s){difficulty=s;render()}
function flash(){let x=TERMS[cardIndex];return `${header('Active recall','Flashcards','Try to explain the concept before revealing the answer.') }<div class="row"><span class="muted">Card ${cardIndex+1} of ${TERMS.length}</span><span>${label(x)}</span></div><div class="bar"><div class="fill" style="width:${100*(cardIndex+1)/TERMS.length}%"></div></div><button class="flip" onclick="flipped=!flipped;render()"><small class="eyebrow">${flipped?'ANSWER · TAP TO SEE QUESTION':'QUESTION · TAP TO FLIP'}</small>${flipped?`<h2>${esc(x.name)}</h2><div class="answer">${esc(x.definition)}</div><p class="muted">Example: ${esc(x.example)}</p>`:`<h2>What is ${esc(x.name)}?</h2><p class="muted">Explain it in simple terms, then click to reveal.</p>`}</button><div class="actions" style="margin-top:18px"><button class="btn ghost" onclick="cardIndex=(cardIndex-1+TERMS.length)%TERMS.length;flipped=false;render()">← Previous</button><button class="btn ${store.done[cardIndex]?'good':''}" onclick="mark(cardIndex)">${store.done[cardIndex]?'✓ Studied':'✓ I know this'}</button><button class="btn primary right" onclick="cardIndex=(cardIndex+1)%TERMS.length;flipped=false;render()">Next card →</button></div><p class="muted small">Tip: keyboard shortcuts: ← previous, → next, Space flip (outside text fields).</p>`}
function quiz(){let available=TERMS.map((x,i)=>({...x,i})).filter(x=>(quizCat==='All'||x.cat===quizCat)&&(quizLevel==='All'||x.level===quizLevel));if(!available.length)return '<p>No questions in this filter.</p>';let chosen=available.find(x=>x.i===quizIndex)||available[0];quizIndex=chosen.i;let x=chosen, prior=store.quiz[quizIndex];return `${header('Knowledge check','Quiz yourself','Pick an answer to see immediate feedback and a plain-English explanation.')}<div class="controls" style="grid-template-columns:1fr 1fr"><div>${selectOpts(CATS,quizCat,'setQuizCat')}</div><div>${selectOpts(['All','Beginner','Intermediate','Advanced'],quizLevel,'setQuizLevel')}</div></div><div class="card"><div class="row"><div>${label(x)}</div><span class="muted small">Session: ${correctSession}/${session} correct</span></div><div class="question">${esc(x.question)}</div><div class="options">${x.options.map((o,j)=>`<button class="option ${answered?(j===x.answer?'correct':j===selectedOption?'incorrect':''):''}" ${answered?'disabled':''} onclick="choose(${j})"><b style="margin-right:11px">${'ABCD'[j]}.</b>${esc(o)}</button>`).join('')}</div>${answered?`<div class="feedback"><b>${selectedOption===x.answer?'✓ Correct':'✕ Not quite'}</b><p>${esc(x.explanation)}</p><p class="muted small"><b>Remember:</b> ${esc(x.definition)}</p></div>`:''}<div class="actions" style="margin-top:20px"><button class="btn ghost" onclick="store.skipped[${quizIndex}]=true;persist();nextQuiz()">Skip question</button><button class="btn ghost" onclick="answered=false;render()">Try again</button><button class="btn primary right" onclick="nextQuiz()">Next question →</button></div></div><p class="muted small">Skipped questions remain available. Quiz results and correct-answer history are saved locally.</p>`}
let selectedOption=-1;function choose(n){if(answered)return;selectedOption=n;answered=true;session++;if(n===TERMS[quizIndex].answer)correctSession++;store.quiz[quizIndex]=n===TERMS[quizIndex].answer;persist();render()}
function nextQuiz(){let ids=TERMS.map((x,i)=>i).filter(i=>(quizCat==='All'||TERMS[i].cat===quizCat)&&(quizLevel==='All'||TERMS[i].level===quizLevel));quizIndex=ids[(ids.indexOf(quizIndex)+1)%ids.length];answered=false;selectedOption=-1;render()}
function setQuizCat(v){quizCat=v;answered=false;quizIndex=0;render()}function setQuizLevel(v){quizLevel=v;answered=false;quizIndex=0;render()}
const prompts=[['System design','Design a backend that accepts a PDF upload, indexes its contents, and lets users ask questions.','Explain API → PostgreSQL metadata → BullMQ job → Worker parsing and chunking → embeddings/pgvector → hybrid retrieval → reranking → SSE answer. Mention tenant isolation and observability.'],['Reliability','An order was saved in PostgreSQL, but the queue went down. How do you avoid losing the event?','Describe writing order and outbox row in one transaction; relay retries publishing; consumer should be idempotent because delivery may repeat.'],['Security','A logged-in user from tenant A tries to query tenant B documents. What stops it?','Verify user and role on the server, scope SQL/vector queries by tenant_id, and authorize every copilot tool. Prompts are not a security boundary.'],['Retrieval','Your RAG system answers poorly when users provide exact invoice numbers. What changes do you make?','Combine keyword/full-text with vectors; preserve IDs in chunks; rerank; evaluate Hit Rate@K and groundedness.'],['Scaling','Your Node.js API becomes slow while ingesting 1,000 PDFs. What would you change?','Move PDF processing to BullMQ workers, control concurrency, monitor queue depth, cache appropriately, scale workers independently, return quick responses.'],['Realtime','When would you choose WebSockets instead of SSE?','WebSockets for two-way communication like collaboration; SSE for server-to-client streaming like AI tokens.'],['AI agents','An agent must request approval before issuing refunds. How would you design this?','Use LangGraph persistent state/checkpoints, an explicit human approval pause, verified tool authorization, idempotent execution, and audit logging.'],['Evaluation','How do you prove RAG quality improved after changing the retriever?','Run fixed golden questions in CI; compare context recall/precision, faithfulness, answer relevance and latency/cost.'],['Tradeoffs','Why not shard PostgreSQL from day one?','Operational complexity. Start with appropriate indexes, pooling and replicas; shard only when primary write/storage limits require it.'],['Intro','Explain your production AI systems experience in 45 seconds.','Mention backend APIs, async workers, secure multi-tenant RAG, hybrid search, stateful agents, deployment and measured evaluation. Use only examples you have actually built.']];
function interview(){let a=prompts[interviewIndex];return `${header('Interview simulator','Practice a human answer','Say your answer out loud or type a response. Reveal the checkpoints afterward.') }<div class="card"><div class="row"><span class="pill">${esc(a[0])}</span><span class="muted small">Prompt ${interviewIndex+1}/${prompts.length}</span></div><div class="question">${esc(a[1])}</div><textarea class="field" id="interviewAnswer" placeholder="Write key points in your own words (optional)..."></textarea><div class="actions" style="margin-top:12px"><button class="btn" onclick="showAnswer=!showAnswer;toggleInterviewFeedback()">${showAnswer?'Hide':'Reveal'} answer checkpoints</button><button class="btn ghost" onclick="interviewIndex=(interviewIndex+1)%prompts.length;showAnswer=false;render()">Skip / next →</button></div><div class="feedback ${showAnswer?'':'hidden'}" id="interviewFeedback"><b>What a strong answer should cover:</b><p>${esc(a[2])}</p><p class="muted small">Practice in your own words. This is a self-review guide, not an AI-scored response.</p></div></div><div class="card"><h3>A natural interview pitch</h3><p class="quote">I build production AI systems with reliable backend APIs, background job processing, secure RAG retrieval, and stateful agent workflows. I focus on performance, clear permissions, and evaluating whether the answers are actually correct.</p><p class="muted small">Adjust this to describe only your genuine experience.</p></div>`}
function toggleInterviewFeedback(){let e=document.getElementById('interviewFeedback');e.classList.toggle('hidden',!showAnswer);let b=e.previousElementSibling.querySelector('button');if(b)b.textContent=showAnswer?'Hide answer checkpoints':'Reveal answer checkpoints'}
function architecture(){return `${header('System design lab','See how the pieces connect','Follow one document from upload to a grounded streaming answer.') }<div class="card"><h2>1. Ingestion: keep the API responsive</h2><div class="three">${[['1 · Fastify API','Authenticate user, validate upload, store metadata.'],['2 · PostgreSQL + Outbox','Persist document and an event atomically.'],['3 · Relay + BullMQ','Deliver the work reliably to an async worker.'],['4 · Worker','Parse, chunk, embed, and index text.'],['5 · pgvector','Store vectors and source references, tenant-scoped.'],['6 · Logs + Retry','Trace requests and retry transient failures.']].map(([a,b])=>`<div class="topic"><strong>${esc(a)}</strong><p class="muted small">${esc(b)}</p></div>`).join('')}</div></div><div class="card"><h2>2. Question answering: retrieve before generating</h2><div class="three">${[['1 · Authorize','Validate user and tenant; redact sensitive data as appropriate.'],['2 · Search','Combine semantic vectors with lexical/keyword matching.'],['3 · Rerank','Keep a few highly relevant source chunks.'],['4 · Generate','Ground the model in retrieved passages.'],['5 · Stream','Send tokens to the UI over SSE.'],['6 · Evaluate','Check recall, precision, groundedness, and relevance.']].map(([a,b])=>`<div class="topic"><strong>${esc(a)}</strong><p class="muted small">${esc(b)}</p></div>`).join('')}</div></div><div class="card"><h2>Key code pattern · concurrent I/O</h2><pre>const [profile, permissions] = await Promise.all([\n  getUserProfile(userId),\n  getUserPermissions(userId)\n]);</pre><p class="muted">Only run in parallel when one operation does not depend on the result of the other.</p><h2>Key SQL pattern · tenant-safe retrieval</h2><pre>SELECT id, content, source_file, page_num\nFROM document_chunks\nWHERE tenant_id = $1\nORDER BY embedding &lt;=&gt; $2::vector\nLIMIT 20;</pre><p class="muted small">Simplified educational query, not a full production hybrid-search ranking implementation. Production queries also require indexes, verified authorization, and safe score normalization.</p><button class="btn" onclick="go('interview')">Practice architecture questions →</button></div>`}
function progress(){let qs=Object.values(store.quiz),right=qs.filter(Boolean).length;return `${header('Progress tracker','Your study progress','Saved locally on this browser. Export a copy if you want to keep it.')}${stats()}<div class="two"><div class="card"><h2>Topic completion</h2>${CATS.slice(1).map(c=>{let all=TERMS.map((x,i)=>({...x,i})).filter(x=>x.cat===c),n=all.filter(x=>store.done[x.i]).length;return `<div class="progressrow"><div class="row"><b>${esc(c)}</b><span class="muted small">${n}/${all.length}</span></div><div class="bar"><div class="fill" style="width:${100*n/all.length}%"></div></div></div>`}).join('')}</div><div class="card"><h2>Quiz results</h2><p><b style="font-size:30px">${right}/${qs.length}</b> <span class="muted">latest recorded answers correct</span></p><p class="muted">${Object.values(store.saved).filter(Boolean).length} saved topics · ${Object.values(store.skipped).filter(Boolean).length} skipped questions</p><div class="actions"><button class="btn" onclick="downloadProgress()">Export progress JSON</button><button class="btn danger" onclick="resetAll()">Reset progress</button></div><p class="small muted">Clearing site storage or opening a different browser/device will not automatically carry over your progress.</p></div></div><div class="card"><h3>Review saved topics</h3>${TERMS.map((x,i)=>store.saved[i]?`<button class="btn ghost" style="margin:4px" onclick="category='All';filter=${JSON.stringify(x.name).replace(/"/g,'&quot;')};go('learn')">${esc(x.name)} →</button>`:'').join('')||'<p class="muted">No saved topics yet. Use ☆ Save in Learn topics.</p>'}</div>`}
function downloadProgress(){let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),progress:store},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='interview-study-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetAll(){if(confirm('Clear all studied topics, quiz results, bookmarks and skipped questions?')){store={done:{},quiz:{},saved:{},skipped:{}};persist();render()}}
function openModal(){document.getElementById('original').textContent=SOURCE;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function render(){app.innerHTML=({home,learn,flash,quiz,interview,architecture,progress}[page])()}
document.addEventListener('keydown',e=>{if(page!=='flash'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();flipped=!flipped;render()}else if(e.key==='ArrowRight'){cardIndex=(cardIndex+1)%TERMS.length;flipped=false;render()}else if(e.key==='ArrowLeft'){cardIndex=(cardIndex-1+TERMS.length)%TERMS.length;flipped=false;render()}});
render();
</script></body></html>
