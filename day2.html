}
function advance(){if(questionIndex<2){questionIndex++;selected=Object.prototype.hasOwnProperty.call(state.answers[current],questionIndex)?state.answers[current][questionIndex]:null;showAnswer=selected!==null;render()}else if(current<7){go(current+1)}else{questionIndex=0;selected=state.answers[current][0]??null;showAnswer=selected!==null;render();alert("You've reached the end of Day 2. Review your answers or revisit any module.")}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-module]");if(b)go(Number(b.dataset.module))});
$("reset").onclick=()=>{if(confirm("Reset only Day 2 answers, skips and notes saved in this browser?")){state={answers:MODULES.map(()=>({})),skipped:[],notes:{},current:0};go(0)}};
go(current);
